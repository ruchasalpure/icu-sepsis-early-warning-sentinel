spec_version: "0.1.0"
name: "icu-sepsis-early-warning-sentinel"
version: "1.0.0"
category: "healthcare"
author: "Rucha Salpure"
description: "Continuously streams ICU arterial pressure, lactate, and SOFA score telemetry to alert clinical staff of impending septic shock up to 6 hours in advance"
capabilities:
  - "sofa-score-temporal-trajectory"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "sofa-score-temporal-trajectory"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
